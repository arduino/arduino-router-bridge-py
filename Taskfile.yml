version: "3"

vars:
  LICENSED_VENV: .venv-licensed
  COPYRIGHT: Arduino s.r.l. and/or its affiliated companies
  # Directories and files that carry inline REUSE headers; the rest is covered by REUSE.toml
  ANNOTATE_PATHS: src tests .github .licensed.yml pyproject.toml Taskfile.yml REUSE.toml

env:
  # licensed crashes on non-ASCII package metadata without a UTF-8 locale
  LC_ALL: en_US.UTF-8

tasks:
  init:
    desc: Create the development venv from the lockfile (project + dev dependencies)
    preconditions:
      - sh: command -v uv
        msg: "uv not found, install it with: brew install uv"
    cmds:
      - uv sync

  test:
    desc: Run the test suite (extra args are passed to pytest)
    preconditions:
      - sh: command -v uv
        msg: "uv not found, install it with: brew install uv"
    cmds:
      - uv run --frozen pytest {{.CLI_ARGS}}

  fmt:
    desc: Apply ruff formatting
    preconditions:
      - sh: command -v uv
        msg: "uv not found, install it with: brew install uv"
    cmds:
      - uv run --frozen ruff format .

  fmt:check:
    desc: Check ruff formatting without modifying files
    preconditions:
      - sh: command -v uv
        msg: "uv not found, install it with: brew install uv"
    cmds:
      - uv run --frozen ruff format --check .

  license:venv:
    internal: true
    env:
      UV_PROJECT_ENVIRONMENT: "{{.LICENSED_VENV}}"
    preconditions:
      - sh: command -v uv
        msg: "uv not found, install it with: brew install uv"
    cmds:
      - uv sync --frozen --no-dev
      # licensed's pip source needs a pip executable inside the venv; uv venvs omit it
      - uv pip install --python {{.LICENSED_VENV}} pip

  license:cache:
    desc: Regenerate the licensed dependency cache and add missing REUSE headers
    deps: [license:venv]
    preconditions:
      - sh: command -v licensed
        msg: "licensed not found, install it with: brew install licensed"
    cmds:
      - licensed cache
      - >-
        uv run --frozen reuse annotate --recursive --skip-unrecognized
        --copyright-prefix spdx-string-c --copyright '{{.COPYRIGHT}}'
        --exclude-year --license MPL-2.0 {{.ANNOTATE_PATHS}}

  license:status:
    desc: Check license compliance (licensed) and header compliance (reuse)
    deps: [license:venv]
    preconditions:
      - sh: command -v licensed
        msg: "licensed not found, install it with: brew install licensed"
    cmds:
      - licensed status
      - uv run --frozen reuse lint
