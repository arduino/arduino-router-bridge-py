version = 1

# Files where inline headers are impractical: docs, plain config, generated cache
[[annotations]]
path = [
    "README.md",
    "CHANGELOG.md",
    ".gitignore",
    ".licenses/**",
    ".python-version",
    ".tool-versions",
    ".release-please-manifest.json",
    "release-please-config.json",
    "src/arduino/router_bridge/py.typed",
    "uv.lock",
]
